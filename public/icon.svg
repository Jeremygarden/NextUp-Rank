<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#020617"/>
  <!-- Glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
  <!-- Ball -->
  <radialGradient id="ball" cx="38%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="60%" stop-color="#e0e7ff"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </radialGradient>
  <circle cx="256" cy="256" r="160" fill="url(#ball)"/>
  <!-- Stripe band -->
  <clipPath id="clip">
    <circle cx="256" cy="256" r="160"/>
  </clipPath>
  <rect x="0" y="210" width="512" height="92" fill="#4f46e5" opacity="0.85" clip-path="url(#clip)"/>
  <!-- Number 1 -->
  <text x="256" y="290" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="110" font-weight="900" fill="#ffffff" letter-spacing="-4">1</text>
</svg>
