<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextUp-Rank — 离线</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #020617;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .brand {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand span {
      color: #6366f1;
    }
    .icon {
      font-size: 3.5rem;
      line-height: 1;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .retry-btn {
      margin-top: 0.5rem;
      padding: 0.65rem 1.75rem;
      background-color: #6366f1;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .retry-btn:hover { background-color: #4f46e5; }
    .retry-btn:active { background-color: #4338ca; }
  </style>
</head>
<body>
  <div class="brand">NextUp-<span>Rank</span></div>
  <div class="icon">📡</div>
  <div class="title">当前网络不可用</div>
  <div class="subtitle">请检查网络连接后重试</div>
  <button class="retry-btn" onclick="location.reload()">重新连接</button>
</body>
</html>
